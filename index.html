<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM21 Studios | Ryadh Al Ariz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e; /* Warna background gelap */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #16213e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 5px; color: #e94560; }
        p { margin-bottom: 30px; color: #a9a9a9; font-size: 14px; line-height: 1.5; }
        .links a {
            display: block;
            background-color: #0f3460;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .links a:hover {
            background-color: #e94560; /* Berubah warna merah saat disentuh mouse */
            transform: translateY(-2px);
        }
    </style>
</head>
